name: Deploy XuanTian Pilgrimage to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 設定 GitHub Token 權限以允許部署至 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只允許一個部署任務執行，避免競爭
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Inject Secrets & Config (Firebase & Admin Email Allowlist)
        env:
          FIREBASE_CONFIG_SECRET: ${{ secrets.FIREBASE_CONFIG_JS }}
          ADMIN_ALLOWED_EMAILS: ${{ secrets.ADMIN_ALLOWED_EMAILS }}
        run: |
          if [ -n "$FIREBASE_CONFIG_SECRET" ]; then
            echo "Injecting Firebase config from GitHub Secret FIREBASE_CONFIG_JS..."
            echo "$FIREBASE_CONFIG_SECRET" > ./web/firebase-config.js
          else
            echo "No FIREBASE_CONFIG_JS secret found, using repository template."
          fi

          if [ -n "$ADMIN_ALLOWED_EMAILS" ]; then
            echo "Injecting ADMIN_ALLOWED_EMAILS from GitHub Repository Secrets..."
            node -e '
              const raw = process.env.ADMIN_ALLOWED_EMAILS || "";
              const emails = raw.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
              const fs = require("fs");
              const path = "./web/firebase-config.js";
              let content = fs.existsSync(path) ? fs.readFileSync(path, "utf8") : "";
              content += "\n// Injected from GitHub Repository Secret: ADMIN_ALLOWED_EMAILS\nwindow.ALLOWED_ADMIN_EMAILS = " + JSON.stringify(emails) + ";\n";
              fs.writeFileSync(path, content, "utf8");
              console.log("Successfully injected " + emails.length + " admin email(s) into firebase-config.js");
            '
          else
            echo "No ADMIN_ALLOWED_EMAILS secret found in repository."
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 將 web/ 目錄打包為靜態網站根目錄
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
